name: 'Composer Setup'
description: 'Run Composer to install all necessary dependencies'
inputs:
  cache-prefix:
    required: true
    description: A unique prefix to prevent cache pollution
    type: string
  directory:
    required: false
    description: The directory containing composer.json

runs:
  using: 'composite'
  steps:
    - name: Subscription check
      env:
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: |
        UPSTREAM="protocolbuffers/protobuf-ci"
        ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
        DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

        echo ""
        echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
        echo "Secure drop-in replacement for $UPSTREAM"
        if [ "$REPO_PRIVATE" = "false" ]; then
          echo -e "\033[32m✓ Free for public repositories\033[0m"
        fi
        echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
        echo ""

        if [ "$REPO_PRIVATE" != "false" ]; then
          SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

          if [ "$SERVER_URL" != "https://github.com" ]; then
            BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
          else
            BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
          fi

          API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

          RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Timeout or API not reachable. Continuing to next step."
          elif [ "$RESPONSE" = "403" ]; then
            echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
            echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
            exit 1
          fi
        fi
      shell: bash

    # This is the trusted path, which can upload to our cache.
    - name: Cache Composer dependencies
      if: ${{ github.event_name != 'pull_request_target' }}
      uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
      with:
        path: ${{ github.workspace }}/composer-cache
        key: composer-${{ runner.os }}-${{ inputs.cache-prefix }}-${{ hashFiles(format('{0}/composer.json', inputs.directory)) }}
        restore-keys: |
          composer-${{ runner.os }}-${{ inputs.cache-prefix }}
          composer-${{ runner.os }}

    # Identical to the above, but will never upload a new cache (untrusted path).
    - name: Restore Composer dependencies from cache
      if: ${{ github.event_name == 'pull_request_target' }}
      uses: actions/cache/restore@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
      with:
        path: ${{ github.workspace }}/composer-cache
        key: composer-${{ runner.os }}-${{ inputs.cache-prefix }}-${{ hashFiles(format('{0}/composer.json', inputs.directory)) }}
        restore-keys: |
          composer-${{ runner.os }}-${{ inputs.cache-prefix }}
          composer-${{ runner.os }}

    - name: Set composer cache environment variable
      shell: bash
      run: echo "COMPOSER_HOME=${{ github.workspace }}/composer-cache" >> $GITHUB_ENV

      # php-actions/composer would be ideal here, but doesn't work on non-Linux
      # (see https://github.com/php-actions/composer/issues/95)
    - name: Run Composer install
      shell: bash
      run: composer install --ignore-platform-reqs --working-dir=${{ inputs.directory }}

    - name: Fix permissions
      shell: bash
      run: sudo chmod -R 777 ${{ inputs.directory }}/composer.lock ${{ inputs.directory }}/vendor
